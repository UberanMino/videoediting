<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>UKG Cover Thumbnail</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Archivo Wide";
        src: url("assets/fonts/archivo-latin-wdth-italic.woff2") format("woff2");
        font-style: italic;
        font-weight: 100 900;
        font-stretch: 62% 125%;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      /* 1:1 cover centred on black, like a streaming single */
      .cover {
        position: absolute;
        left: 420px;
        top: 0;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #photo-wrap {
        position: absolute;
        inset: 0;
      }
      #photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 54% 30%;
      }
      #grain {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1080px;
        mix-blend-mode: overlay;
        opacity: 0.5;
      }
      .tag {
        position: absolute;
        left: 26px;
        top: 24px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .tag-name {
        font-family: "Archivo Wide", sans-serif;
        font-style: italic;
        font-weight: 800;
        font-stretch: 125%;
        font-size: 17px;
        line-height: 1.02;
        letter-spacing: 0.04em;
        color: #fff;
        white-space: nowrap;
      }
      #barcode {
        width: 128px;
        height: 52px;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-ei7x" id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1920" data-height="1080">
      <section data-hf-id="hf-u7xn" id="scene-cover" class="clip" data-start="0" data-duration="3" data-track-index="0">
        <div data-hf-id="hf-9rcc" class="cover" id="cover">
          <div data-hf-id="hf-2caw" id="photo-wrap" data-layout-allow-overflow>
            <img data-color-grading="{&quot;preset&quot;:null,&quot;intensity&quot;:1,&quot;adjust&quot;:{&quot;exposure&quot;:0.12,&quot;contrast&quot;:0.55,&quot;highlights&quot;:0.05,&quot;shadows&quot;:0,&quot;whites&quot;:0,&quot;blacks&quot;:-0.4,&quot;temperature&quot;:0,&quot;tint&quot;:0,&quot;vibrance&quot;:0,&quot;saturation&quot;:-1},&quot;details&quot;:{&quot;vignette&quot;:0.45,&quot;vignetteMidpoint&quot;:0.5,&quot;vignetteRoundness&quot;:0,&quot;vignetteFeather&quot;:0.65,&quot;grain&quot;:0,&quot;grainSize&quot;:0.25,&quot;grainRoughness&quot;:0.5},&quot;effects&quot;:{&quot;blur&quot;:0,&quot;pixelate&quot;:0,&quot;chromaBleed&quot;:0,&quot;tapeDamage&quot;:0,&quot;tapeTracking&quot;:0,&quot;tapeNoise&quot;:1,&quot;tapeSpeed&quot;:0.5,&quot;filmArtifacts&quot;:0,&quot;halftone&quot;:0,&quot;halftoneSize&quot;:0,&quot;twoInkPrint&quot;:0,&quot;twoInkPrintSize&quot;:0,&quot;ascii&quot;:0,&quot;asciiSize&quot;:0.06578947368421052,&quot;asciiInvert&quot;:0,&quot;asciiStyle&quot;:0,&quot;asciiColor&quot;:1,&quot;asciiRotation&quot;:0,&quot;dither&quot;:0,&quot;ditherSize&quot;:0,&quot;bloom&quot;:0,&quot;bloomRadius&quot;:8,&quot;monoScreen&quot;:0,&quot;monoScreenSize&quot;:0,&quot;monoScreenAngle&quot;:0,&quot;monoScreenSpread&quot;:0,&quot;monoScreenShape&quot;:0,&quot;monoScreenInvert&quot;:0,&quot;scanlines&quot;:0,&quot;scanlineCount&quot;:0,&quot;scanlineSoftness&quot;:0,&quot;chromaticAberration&quot;:0,&quot;chromaticAngle&quot;:0,&quot;crtCurvature&quot;:0,&quot;digitalGlitch&quot;:0,&quot;digitalGlitchColorSplit&quot;:0,&quot;digitalGlitchLineTear&quot;:0,&quot;digitalGlitchPixelate&quot;:0,&quot;digitalGlitchBlockAmount&quot;:0,&quot;digitalGlitchBlockDisplacement&quot;:0,&quot;digitalGlitchBlockOpacity&quot;:0,&quot;digitalGlitchSpeed&quot;:0,&quot;engraving&quot;:0,&quot;engravingSpacing&quot;:0.4117647058823529,&quot;engravingMinThickness&quot;:0.2,&quot;engravingMaxThickness&quot;:0.4571428571428572,&quot;engravingAngle&quot;:0.25,&quot;engravingContrast&quot;:0.4666666666666667,&quot;engravingSharpness&quot;:0.59,&quot;engravingWave&quot;:0.2,&quot;engravingWaveFrequency&quot;:0.2222222222222222,&quot;crosshatch&quot;:0,&quot;crosshatchSpacing&quot;:0.28,&quot;crosshatchThickness&quot;:0.25,&quot;crosshatchAngle&quot;:0.25,&quot;crosshatchContrast&quot;:0.3333333333333333,&quot;crosshatchEdges&quot;:0.5,&quot;crosshatchLineWeight&quot;:0,&quot;crosshatchWave&quot;:0.33,&quot;crosshatchWaveFrequency&quot;:0.2222222222222222,&quot;kuwahara&quot;:0,&quot;kuwaharaRadius&quot;:0.14285714285714285,&quot;kuwaharaSharpness&quot;:0.3125,&quot;kuwaharaSaturation&quot;:0.5},&quot;lut&quot;:null,&quot;colorSpace&quot;:&quot;rec709&quot;,&quot;curves&quot;:{&quot;master&quot;:[[0,0],[1,1]],&quot;red&quot;:[[0,0],[0.35,0.02],[0.65,0.52],[1,0.93]],&quot;green&quot;:[[0,0],[0.3,0.05],[0.6,0.72],[1,1]],&quot;blue&quot;:[[0,0],[0.7,0.02],[1,0.28]]}}" data-hf-id="hf-myfp" id="photo" src="assets/img/dance-duo.jpg" alt="">
          </div>
          <canvas data-hf-id="hf-iuyl" id="grain" width="1080" height="1080" data-layout-ignore=""></canvas>
          <div data-hf-id="hf-ny6m" class="tag" id="tag">
            <div data-hf-id="hf-2kjo" class="tag-name"><div data-hf-id="hf-nhoc">UBERAN MINO</div><div data-hf-id="hf-lbtx">BEATS</div></div>
            <svg data-hf-id="hf-n74h" id="barcode" viewBox="0 0 196 70" aria-hidden="true" />
          </div>
        </div>
      </section>
    </div>

    <script>
      (function drawGrain() {
        const c = document.getElementById("grain").getContext("2d");
        const img = c.createImageData(1080, 1080);
        let s = 1337;
        for (let i = 0; i < img.data.length; i += 4) {
          s = (Math.imul(s, 1664525) + 1013904223) | 0;
          const v = (s >>> 24) & 255;
          img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
          img.data[i + 3] = 255;
        }
        c.putImageData(img, 0, 0);
      })();

      (function drawBarcode() {
        const svg = document.getElementById("barcode");
        const pattern = [3, 1, 1, 2, 4, 1, 1, 3, 2, 1, 1, 1, 3, 2, 1, 4, 1, 2, 1, 1, 2, 3, 1, 1, 4, 2, 1, 1, 2, 1, 3, 1, 1, 2, 1, 3, 2, 1, 1, 3];
        let x = 0,
          on = true,
          out = "";
        for (const w of pattern) {
          const width = w * 2.2;
          if (on) out += `<rect x="${x.toFixed(1)}" y="0" width="${width.toFixed(1)}" height="70" fill="#ffffff"/>`;
          x += width;
          on = !on;
        }
        svg.setAttribute("viewBox", `0 0 ${x.toFixed(1)} 70`);
        svg.innerHTML = out;
      })();

      // ---------- timeline ----------
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#photo-wrap", { scale: 1.14 }, { scale: 1.02, duration: 3, ease: "power2.out" }, 0);
      tl.fromTo("#tag", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.4);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
