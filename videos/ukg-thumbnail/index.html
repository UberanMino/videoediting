      @font-face {
        font-family: "Anton";

      }
      @font-face {
        font-family: "Archivo Black";
        src: url("assets/fonts/archivo-black-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Pinyon Script";
        src: url("assets/fonts/pinyon-script-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Space Mono";
        src: url("assets/fonts/space-mono-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
      }

      :root {
        --ink: #0b0420;
        --violet: #6a1cff;
        --pink: #ff2e9a;
        --hot: #ff5fb8;
        --ice: #bff4ff;
        --white: #fff6fb;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ink);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ink);
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* ---------- background: dancing duo, deep duotone, tilted ---------- */
      .bg-wrap {
        position: absolute;
        inset: -120px;
      }
      #bg-duo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 30%;
        opacity: 0.7;
      }

      /* ---------- hero: three girls, dizzy double-vision ---------- */
      .hero-wrap {
        position: absolute;
        top: 0;
        right: -40px;
        width: 1300px;
        height: 1080px;
        -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 22%, #000 100%);
        mask-image: linear-gradient(90deg, transparent 0%, #000 22%, #000 100%);
      }
      .hero-layer {
        position: absolute;
        inset: 0;
      }
      .hero-layer img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 62% 40%;
      }
      .ghost {
        mix-blend-mode: screen;
      }
      #ghost-a {
        opacity: 0.36;
      }
      #ghost-b {
        opacity: 0.42;
      }

      /* soft club light blooms */
      .bloom {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        mix-blend-mode: screen;
      }
      #bloom-pink {
        width: 620px;
        height: 620px;
        left: 980px;
        top: -220px;
        background: radial-gradient(circle, rgba(255, 46, 154, 0.75), rgba(255, 46, 154, 0) 70%);
      }
      #bloom-violet {
        width: 760px;
        height: 760px;
        left: -260px;
        top: 520px;
        background: radial-gradient(circle, rgba(106, 28, 255, 0.8), rgba(106, 28, 255, 0) 70%);
      }

      /* ---------- type block ---------- */
      .type {
        position: absolute;
        left: 86px;
        top: 150px;
        width: 900px;
        height: 800px;
      }
      .tag {
        position: absolute;
        left: 6px;
        top: 0;
        display: flex;
        align-items: center;
        gap: 18px;
        height: 64px;
        padding: 0 28px;
        background: var(--pink);
        color: var(--white);
        font-family: "Space Mono", monospace;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 0.06em;
        white-space: nowrap;
        border-radius: 999px;
        box-shadow: 0 0 40px rgba(255, 46, 154, 0.65);
      }
      .tag .x {
        color: var(--ink);
      }

      .title-stack {
        position: absolute;
        left: -10px;
        top: 70px;
        width: 900px;
        height: 460px;
      }
      .title {
        position: absolute;
        left: 0;
        top: 0;
        font-family: "Anton", sans-serif;
        font-size: 400px;
        line-height: 1;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      /* echo copies behind the main word = drunk double vision */
      #echo-violet {
        color: var(--violet);
        opacity: 0.9;
      }
      #echo-pink {
        color: transparent;
        -webkit-text-stroke: 4px var(--pink);
      }
      #title-main {
        background: linear-gradient(
          180deg,
          #ffffff 0%,
          #ffe3f3 38%,
          #ff9fd2 50%,
          #ffffff 54%,
          #d8f7ff 78%,
          #ffffff 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 10px 0 rgba(11, 4, 32, 0.55)) drop-shadow(0 0 34px rgba(255, 46, 154, 0.55));
      }

      .script {
        position: absolute;
        left: 250px;
        top: 440px;
        font-family: "Pinyon Script", cursive;
        font-size: 190px;
        line-height: 1;
        color: var(--hot);
        white-space: nowrap;
        text-shadow:
          0 0 18px rgba(255, 46, 154, 0.9),
          0 0 60px rgba(255, 46, 154, 0.6),
          4px 6px 0 var(--ink);
      }

      .strip {
        position: absolute;
        left: 6px;
        top: 700px;
        display: flex;
        gap: 14px;
      }
      .chip {
        height: 58px;
        padding: 0 22px;
        display: flex;
        align-items: center;
        font-family: "Archivo Black", sans-serif;
        font-size: 30px;
        letter-spacing: 0.04em;
        color: var(--ink);
        background: var(--ice);
        white-space: nowrap;
      }
      .chip.dark {
        background: var(--ink);
        color: var(--white);
        border: 3px solid var(--white);
      }

      /* ---------- Y2K decorations ---------- */
      .spark {
        position: absolute;
        filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.9)) drop-shadow(0 0 30px rgba(255, 46, 154, 0.8));
      }
      #spark-1 {
        left: 1220px;
        top: 110px;
        width: 120px;
        height: 120px;
      }
      #spark-2 {
        left: 1790px;
        top: 560px;
        width: 76px;
        height: 76px;
      }
      #spark-3 {
        left: 840px;
        top: 150px;
        width: 64px;
        height: 64px;
      }
      #spark-4 {
        left: 1450px;
        top: 900px;
        width: 54px;
        height: 54px;
      }

      #ring {
        position: absolute;
        left: 1580px;
        top: 60px;
        width: 290px;
        height: 290px;
      }
      #ring text {
        font-family: "Space Mono", monospace;
        font-weight: 700;
        font-size: 24px;
        letter-spacing: 0;
        fill: var(--white);
      }

      /* frame edge */
      .frame {
        position: absolute;
        inset: 26px;
        border: 3px solid rgba(255, 246, 251, 0.75);
        border-radius: 22px;
        pointer-events: none;
      }
    </style>
