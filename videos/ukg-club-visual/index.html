    <script>
      (function () {
        const DUR = 15.232;
        const FPS = 30;
        const NS = "http://www.w3.org/2000/svg";
        const $ = (id) => document.getElementById(id);

        // ---------- timing (audiomap.json + band onsets, 136 BPM UKG 2-step) ----------
        const BEATS = [
          -0.255, 0.186, 0.627, 1.068, 1.486, 1.927, 2.368, 2.786, 3.228, 3.669, 4.11, 4.528, 4.969, 5.41, 5.851, 6.269, 6.711, 7.129,
          7.57, 8.011, 8.452, 8.87, 9.311, 9.752, 10.194, 10.612, 11.053, 11.494, 11.935, 12.353, 12.794, 13.235, 13.677, 14.095,
          14.489, 14.861, 15.3,
        ];
        const DOWN = [1.486, 3.228, 4.969, 6.711, 8.452, 10.194, 11.935, 13.677];
        const KICKS = [1.474, 2.345, 3.669, 4.54, 4.969, 5.805, 7.152, 7.546, 7.988, 8.452, 10.623, 11.053, 11.923, 14.071, 14.547, 14.977];
        const HITS = [1.916, 2.786, 3.646, 4.516, 4.737, 5.387, 6.258, 7.129, 7.999, 8.44, 8.87, 9.451, 9.741, 10.6, 11.691, 12.144, 12.341, 12.934, 14.083, 14.954, 15.07];

        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, k) => a + (b - a) * k;
        const smooth = (a, b, x) => {
          const k = clamp((x - a) / (b - a), 0, 1);
          return k * k * (3 - 2 * k);
        };
        const easeOut = (k) => 1 - Math.pow(1 - clamp(k, 0, 1), 3);
        function pulse(list, t, decay) {
          let v = 0;
          for (const x of list) {
            if (x > t + 1e-6) break;
            v = Math.max(v, Math.exp(-(t - x) * decay));
          }
          return v;
        }
        function beatInfo(t) {
          let i = 0;
          for (let k = 0; k < BEATS.length - 1; k++) if (BEATS[k] <= t + 1e-6) i = k;
          const ph = clamp((t - BEATS[i]) / (BEATS[i + 1] - BEATS[i]), 0, 1);
          return { i, ph, count: i + ph };
        }
        function mulberry32(a) {
          return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        // ---------- palette (linear, pre-tonemap) ----------
        const MAG = [1.0, 0.16, 0.72],
          CYAN = [0.18, 0.72, 1.0],
          VIOLET = [0.55, 0.28, 1.0],
          AMBER = [1.0, 0.6, 0.22],
          GREEN = [0.2, 1.0, 0.35],
          RED = [1.0, 0.07, 0.12],
          BLUE = [0.14, 0.28, 1.0],
          WHITE = [1.0, 0.94, 0.9];

        // ---------- shot list ----------
        // sc: 0 fog/backlight · 1 mirror ball · 2 lasers · 3 liquid chrome · 4 LED floor · 5 moving heads + crowd · 6 vinyl
        const SHOTS = [
          {
            s: 0, e: 1.486, sc: 0,
            u(l, t, U) {
              U.P0 = [0.0, 0.25 + 0.75 * smooth(0, 1.3, t), 0.0, 0.45 * smooth(0.5, 1.4, t)];
              U.cA = BLUE; U.cB = MAG;
              U.zoom = 1.0 + l * 0.08;
              U.exp = 0.95;
              if (t > 1.3 && t < 1.47) U.P0[1] *= 0.35 + 0.65 * (Math.floor(t * 24) % 2);
            },
          },
          {
            s: 1.486, e: 2.368, sc: 1, ca: 1,
            u(l, t, U) {
              const d = easeOut(l / 0.5);
              U.P0 = [0.0, lerp(0.34, 0.15, d), 0.17, 0.55];
              U.P1 = [1.0, 0.9, 1.0, 0];
              U.cA = MAG; U.cB = CYAN; U.cC = AMBER;
              U.zoom = 1.06 - l * 0.05;
              U.rot = -0.03 + l * 0.04;
            },
          },
          {
            s: 2.368, e: 3.228, sc: 0,
            u(l, t, U) {
              U.P0 = [0.15, 0.8, 1.0, 0.25];
              U.cA = VIOLET; U.cB = MAG;
              U.zoom = 1.02 + l * 0.04;
            },
          },
          {
            s: 3.228, e: 4.11, sc: 2, ca: 1,
            u(l, t, U) {
              U.P0 = [0.0, -0.56, Math.PI / 2, 1.5];
              U.P1 = [0.28, 0, 0, 0.0];
              U.cA = GREEN; U.cB = MAG;
              U.zoom = 1.0 + l * 0.05;
              U.rot = Math.sin(l * 2) * 0.04;
            },
          },
          {
            s: 4.11, e: 4.969, sc: 1, ca: 1,
            u(l, t, U) {
              U.P0 = [0.06, -0.03, 0.56, 0.9];
              U.P1 = [0.5, 0.0, 1.4, 0];
              U.cA = AMBER; U.cB = MAG; U.cC = CYAN;
              U.zoom = 1.0 + l * 0.06;
              U.rot = 0.1 - l * 0.08;
            },
          },
          {
            s: 4.969, e: 5.851, sc: 0,
            u(l, t, U) {
              U.P0 = [-0.2, 0.7, 1.2, 0.35];
              U.cA = CYAN; U.cB = MAG;
              U.zoom = 1.1 + l * 0.05;
            },
          },
          {
            s: 5.851, e: 6.711, sc: 3,
            u(l, t, U) {
              U.kal = l < 0.42 ? 6 : 8;
              U.warp = 0.35;
              U.hue = l * 0.9;
              U.cA = VIOLET; U.cB = MAG; U.cC = CYAN;
              U.zoom = 1.25 - l * 0.2;
              U.rot = l * 0.5;
            },
          },
          {
            s: 6.711, e: 7.57, sc: 4,
            u(l, t, U) {
              U.P0 = [0.1, 0.3, 2.2, beatInfo(t).i];
              U.cA = MAG; U.cB = CYAN; U.cC = VIOLET;
              U.zoom = 1.04 + l * 0.04;
              U.rot = -0.05 + l * 0.06;
            },
          },
          {
            s: 7.57, e: 8.15, sc: 0,
            u(l, t, U) {
              U.P0 = [0.3, 0.75, 1.1, 0.3];
              U.cA = MAG; U.cB = BLUE;
              U.zoom = 1.02 + l * 0.05;
            },
          },
          {
            // seen through the left lens during the zoom-through, then full frame
            s: 8.15, e: 9.311, sc: 1, ca: 1,
            u(l, t, U) {
              const k = smooth(8.452, 9.311, t);
              U.P0 = [lerp(-0.04, 0.0, k), lerp(0.0, 0.08, k), lerp(0.1, 0.2, k), 0.75];
              U.P1 = [1.25, 1.1, 1.0, 0];
              U.cA = CYAN; U.cB = MAG; U.cC = WHITE;
              U.zoom = 1.0 + 0.05 * k;
              U.rot = t > 8.452 ? (t - 8.452) * 0.22 : 0;
            },
          },
          {
            s: 9.311, e: 10.194, sc: 5,
            u(l, t, U) {
              U.P0 = [1.3, beatInfo(t).ph, 0, 0];
              U.cA = AMBER; U.cB = BLUE;
              U.zoom = 1.08 - l * 0.06;
            },
          },
          {
            s: 10.194, e: 11.053, sc: 6, ca: 1,
            u(l, t, U) {
              U.P0 = [0.22, -0.06, 0.44, 2.2 + l * 0.9];
              U.P1 = [4.0, 0, 0, 0];
              U.cA = MAG; U.cB = CYAN; U.cC = VIOLET;
              U.zoom = 1.0 + l * 0.08;
              U.rot = -0.12 + l * 0.05;
            },
          },
          {
            s: 11.053, e: 11.935, sc: 2, ca: 1,
            u(l, t, U) {
              U.P0 = [0.0, 0.56, -Math.PI / 2, 1.15];
              U.P1 = [0.35, 0, 0, 2.0];
              U.cA = RED; U.cB = BLUE;
              U.zoom = 1.03 + l * 0.05;
            },
          },
          {
            s: 11.935, e: 12.794, sc: 0,
            u(l, t, U) {
              U.P0 = [0.0, 0.8, 1.0, 0.4];
              U.cA = VIOLET; U.cB = CYAN;
              U.warp = 0.25;
              U.hue = Math.sin(l * 3) * 0.25;
            },
          },
          // 2-beat montage: four half-beat cuts
          {
            s: 12.794, e: 13.015, sc: 1, ca: 1,
            u(l, t, U) {
              U.P0 = [-0.05, 0.02, 0.5, 1.1];
              U.P1 = [0.6, 0, 1.4, 0];
              U.cA = MAG; U.cB = AMBER; U.cC = CYAN;
            },
          },
          {
            s: 13.015, e: 13.235, sc: 2, ca: 1,
            u(l, t, U) {
              U.P0 = [-0.3, -0.56, 1.2, 1.3];
              U.P1 = [0.3, 0, 0, 4.0];
              U.cA = CYAN; U.cB = MAG;
            },
          },
          {
            s: 13.235, e: 13.456, sc: 4,
            u(l, t, U) {
              U.P0 = [0.02, 0.3, 3.0, 37];
              U.cA = VIOLET; U.cB = MAG; U.cC = CYAN;
              U.rot = 0.12;
            },
          },
          {
            s: 13.456, e: 13.677, sc: 3,
            u(l, t, U) {
              U.kal = 5;
              U.warp = 0.4;
              U.cA = CYAN; U.cB = MAG; U.cC = AMBER;
            },
          },
          {
            s: 13.677, e: DUR + 1, sc: 1, ca: 1,
            u(l, t, U) {
              const k = easeOut(l / 1.4);
              U.P0 = [0.0, lerp(-0.02, 0.1, k), lerp(0.42, 0.15, k), 0.6 + l * 0.3];
              U.P1 = [1.2 + l * 0.6, 1.0 + l * 0.4, 1.0, 0];
              U.cA = MAG; U.cB = CYAN; U.cC = AMBER;
              U.rot = l * 0.12;
            },
          },
        ];
        function shotAt(t) {
          for (const s of SHOTS) if (t >= s.s && t < s.e) return s;
          return SHOTS[SHOTS.length - 1];
        }

        // ---------- fog texture (seeded, tileable, generated once) ----------
        function fogTexture(seed) {
          const N = 256;
          const r = mulberry32(seed);
          const lat = [];
          for (let o = 0; o < 5; o++) {
            const P = 4 << o;
            const g = new Float32Array(P * P);
            for (let i = 0; i < g.length; i++) g[i] = r();
            lat.push({ P, g });
          }
          const c = document.createElement("canvas");
          c.width = c.height = N;
          const x = c.getContext("2d");
          const img = x.createImageData(N, N);
          for (let y = 0; y < N; y++)
            for (let xx = 0; xx < N; xx++) {
              let v = 0,
                a = 0.5;
              for (const { P, g } of lat) {
                const fx = (xx / N) * P,
                  fy = (y / N) * P;
                const ix = Math.floor(fx),
                  iy = Math.floor(fy);
                let tx = fx - ix,
                  ty = fy - iy;
                tx = tx * tx * (3 - 2 * tx);
                ty = ty * ty * (3 - 2 * ty);
                const at = (i, j) => g[((j + P) % P) * P + ((i + P) % P)];
                const v0 = at(ix, iy) + (at(ix + 1, iy) - at(ix, iy)) * tx;
                const v1 = at(ix, iy + 1) + (at(ix + 1, iy + 1) - at(ix, iy + 1)) * tx;
                v += a * (v0 + (v1 - v0) * ty);
                a *= 0.5;
              }
              const d = Math.pow(clamp((v - 0.35) * 1.8, 0, 1), 1.6) * 255;
              const k = (y * N + xx) * 4;
              img.data[k] = img.data[k + 1] = img.data[k + 2] = d;
              img.data[k + 3] = 255;
            }
          x.putImageData(img, 0, 0);
          return c.toDataURL();
        }
        $("fog1").style.backgroundImage = `url(${fogTexture(11)})`;
        $("fog2").style.backgroundImage = `url(${fogTexture(29)})`;
        (function () {
          const c = document.createElement("canvas");
          c.width = c.height = 192;
          const x = c.getContext("2d");
          const img = x.createImageData(192, 192);
          const r = mulberry32(42);
          for (let i = 0; i < img.data.length; i += 4) {
            const v = Math.floor(r() * 255);
            img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
            img.data[i + 3] = 255;
          }
          x.putImageData(img, 0, 0);
          $("grain").style.backgroundImage = `url(${c.toDataURL()})`;
        })();

        // ---------- neon face silhouette with sunglasses ----------
        const PATH = {
          hair: "M500,160 C690,160 792,300 782,500 C776,640 800,760 832,880 C764,906 702,896 652,862 L348,862 C298,896 236,906 168,880 C200,760 224,640 218,500 C208,300 310,160 500,160 Z",
          face: "M332,478 C332,392 402,332 500,332 C598,332 668,392 668,478 C670,600 650,700 600,770 C570,815 535,840 500,842 C465,840 430,815 400,770 C350,700 330,600 332,478 Z",
          fringe: "M328,468 C338,352 420,286 522,290 C612,294 682,352 676,470 C640,402 580,372 520,380 C450,390 382,420 328,468 Z",
          body: "M438,800 L438,928 C398,958 300,974 200,1010 C128,1036 88,1100 78,1260 L922,1260 C912,1100 872,1036 800,1010 C700,974 602,958 562,928 L562,800 Z",
          lensL: "M346,506 C346,490 362,484 380,485 L478,490 C491,491 497,500 495,513 L488,560 C484,586 464,598 440,598 L394,596 C364,594 348,576 347,552 Z",
          lensR: "M654,506 C654,490 638,484 620,485 L522,490 C509,491 503,500 505,513 L512,560 C516,586 536,598 560,598 L606,596 C636,594 652,576 653,552 Z",
          bridge: "M495,506 Q500,497 505,506",
          temples: "M347,512 L326,506 M653,512 L674,506",
          nose: "M506,604 C512,642 522,670 512,690 C504,700 490,700 481,693",
          lipsU: "M444,736 C468,722 489,721 500,728 C511,721 532,722 556,736 C530,744 470,744 444,736 Z",
          lipsL: "M449,738 C468,768 532,768 551,738 C526,747 474,747 449,738 Z",
          chain: "M432,934 C462,990 538,990 568,934",
          jaw: "M372,720 C400,775 450,822 500,828 C550,822 600,775 628,720",
        };
        let FID = 0;
        function sv(tag, attrs, parent) {
          const e = document.createElementNS(NS, tag);
          for (const k in attrs) e.setAttribute(k, attrs[k]);
          if (parent) parent.appendChild(e);
          return e;
        }
        function makeFace(host, opts = {}) {
          const id = "f" + FID++;
          const svg = sv("svg", { viewBox: "0 0 1000 1250" }, null);
          if (opts.ghost) svg.classList.add("ghost");
          host.appendChild(svg);
          const defs = sv("defs", {}, svg);
          const rim = sv("linearGradient", { id: id + "rim", x1: "0", y1: "0", x2: "1", y2: "0.3" }, defs);
          sv("stop", { offset: "0%", "stop-color": opts.c1 || "#ff2bd6" }, rim);
          sv("stop", { offset: "50%", "stop-color": opts.c2 || "#9a6bff" }, rim);
          sv("stop", { offset: "100%", "stop-color": opts.c3 || "#2be4ff" }, rim);
          const skin = sv("radialGradient", { id: id + "skin", cx: "35%", cy: "30%", r: "80%" }, defs);
          sv("stop", { offset: "0%", "stop-color": "#1a0b24" }, skin);
          sv("stop", { offset: "100%", "stop-color": "#040108" }, skin);
          const lens = sv("linearGradient", { id: id + "lens", gradientUnits: "userSpaceOnUse", x1: "300", y1: "470", x2: "700", y2: "610" }, defs);
          [
            ["0%", "#0b0016"],
            ["30%", "#2a0845"],
            ["44%", "#ff4fd8"],
            ["47%", "#fff6fd"],
            ["50%", "#58e0ff"],
            ["58%", "#1c0535"],
            ["100%", "#030008"],
          ].forEach(([o, c]) => sv("stop", { offset: o, "stop-color": c }, lens));
          const mask = sv("mask", { id: id + "hole", maskUnits: "userSpaceOnUse", x: "-20000", y: "-20000", width: "40000", height: "40000" }, defs);
          sv("rect", { x: "-20000", y: "-20000", width: "40000", height: "40000", fill: "#fff" }, mask);
          sv("path", { d: PATH.lensL, fill: "#000" }, mask);
          sv("path", { d: PATH.lensR, fill: "#000" }, mask);

          const ghost = !!opts.ghost;
          const fill = ghost ? "none" : `url(#${id}skin)`;
          const stroke = ghost ? opts.ghost : `url(#${id}rim)`;
          const W = { "stroke-linejoin": "round", "stroke-linecap": "round" };
          const body = sv("g", {}, svg);
          sv("path", { ...W, d: PATH.body, fill, stroke, "stroke-width": 5 }, body);
          const chain = sv("path", { ...W, d: PATH.chain, fill: "none", stroke: ghost ? opts.ghost : "#ffd27a", "stroke-width": 7, "stroke-dasharray": "1 13" }, body);
          const head = sv("g", {}, svg);
          const skinG = sv("g", { mask: `url(#${id}hole)` }, head);
          const backdrop = sv("rect", { x: "-20000", y: "-20000", width: "40000", height: "40000", fill: "#030106", opacity: 0 }, skinG);
          sv("path", { ...W, d: PATH.hair, fill, stroke, "stroke-width": 5 }, skinG);
          sv("path", { ...W, d: PATH.face, fill, stroke, "stroke-width": 3, "stroke-opacity": 0.55 }, skinG);
          sv("path", { ...W, d: PATH.fringe, fill, stroke, "stroke-width": 4 }, skinG);
          sv("path", { ...W, d: PATH.jaw, fill: "none", stroke, "stroke-width": 2, "stroke-opacity": 0.35 }, skinG);
          sv("path", { ...W, d: PATH.nose, fill: "none", stroke, "stroke-width": 3, "stroke-opacity": 0.7 }, skinG);
          sv("path", { ...W, d: PATH.lipsU, fill: ghost ? "none" : "#c2187f", stroke: ghost ? opts.ghost : "#ff5bd0", "stroke-width": 3 }, skinG);
          sv("path", { ...W, d: PATH.lipsL, fill: ghost ? "none" : "#e0279a", stroke: ghost ? opts.ghost : "#ff5bd0", "stroke-width": 3 }, skinG);
          const lenses = sv("g", {}, head);
          const lensFill = [];
          [PATH.lensL, PATH.lensR].forEach((d) => {
            lensFill.push(sv("path", { d, fill: ghost ? "none" : `url(#${id}lens)` }, lenses));

            `
vec2 xform(vec2 p){
  p=rot(uRot)*p; p/=uZoom;
  if (uWarp > 0.) p += uWarp*.02*vec2(sin(p.y*7.+uT*2.), cos(p.x*7.+uT*1.7));
  if (uKal > .5) { float r=length(p), a=atan(p.y,p.x), seg=6.28318/uKal; a=mod(a,seg); a=abs(a-seg*.5); p=r*vec2(cos(a),sin(a)); }
  return p;
}
vec3 shade(vec2 p0){ return ${F}(xform(p0), uT); }
vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14), 0., 1.); }
void main(){
  vec2 p0=(gl_FragCoord.xy - .5*uRes)/uRes.y;
  vec3 col;
  ${ca ? "float k=uCA*length(p0); col.r=shade(p0*(1.+k)).r; col.g=shade(p0).g; col.b=shade(p0*(1.-k)).b;" : "col=shade(p0);"}
  col=aces(col*uExp);
  if (uHue != 0.) col=clamp(hueShift(col,uHue),0.,1.);
  col=pow(col, vec3(1.05,1.,.97));
  float v=length(p0*vec2(1.25,.85)); col*=1.-.55*smoothstep(.25,.7,v);
  gl_FragColor=vec4(col,1.);
}`
          );
        }
        function sh(type, src) {
          const s = gl.createShader(type);
          gl.shaderSource(s, src);
          gl.compileShader(s);
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
          return s;
        }
        const UN = ["uRes", "uT", "uL", "uBeat", "uHit", "uPh", "uP0", "uP1", "uCA3", "uCB3", "uCC3", "uZoom", "uRot", "uKal", "uWarp", "uCA", "uHue", "uExp"];
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        const PROGS = {};
        function program(sc, ca) {
          const key = sc + "_" + ca;
          if (PROGS[key]) return PROGS[key];
          const prog = gl.createProgram();
          gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
          gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fsFor(sc, ca)));
          gl.linkProgram(prog);
          const U = { prog, loc: gl.getAttribLocation(prog, "p") };
          UN.forEach((n) => (U[n] = gl.getUniformLocation(prog, n)));
          return (PROGS[key] = U);
        }
        gl.viewport(0, 0, canvas.width, canvas.height);

        function drawGL(t) {
          const shot = shotAt(t);
          const l = t - shot.s;
          const U0 = { P0: [0, 0, 0, 0], P1: [0, 0, 0, 0], cA: MAG, cB: CYAN, cC: VIOLET, zoom: 1, rot: 0, kal: 0, warp: 0, ca: 0.012, hue: 0, exp: 1.0 };
          shot.u(l, t, U0);
          const kick = pulse(KICKS, t, 7);
          const hit = pulse(HITS, t, 10);
          const down = pulse(DOWN, t, 6);
          U0.zoom *= 1 + 0.012 * kick + 0.03 * down;
          const U = program(shot.sc, shot.ca ? 1 : 0);
          gl.useProgram(U.prog);
          gl.bindBuffer(gl.ARRAY_BUFFER, buf);
          gl.enableVertexAttribArray(U.loc);
          gl.vertexAttribPointer(U.loc, 2, gl.FLOAT, false, 0, 0);
          gl.uniform2f(U.uRes, canvas.width, canvas.height);
          gl.uniform1f(U.uT, t);
          gl.uniform1f(U.uL, l);
          gl.uniform1f(U.uBeat, Math.max(kick, pulse(BEATS, t, 9) * 0.6));
          gl.uniform1f(U.uHit, hit);
          gl.uniform1f(U.uPh, beatInfo(t).ph);
          gl.uniform4fv(U.uP0, U0.P0);
          gl.uniform4fv(U.uP1, U0.P1);
          gl.uniform3fv(U.uCA3, U0.cA);
          gl.uniform3fv(U.uCB3, U0.cB);
          gl.uniform3fv(U.uCC3, U0.cC);
          gl.uniform1f(U.uZoom, U0.zoom);
          gl.uniform1f(U.uRot, U0.rot);
          gl.uniform1f(U.uKal, U0.kal);
          gl.uniform1f(U.uWarp, U0.warp);
          gl.uniform1f(U.uCA, U0.ca + 0.02 * hit);
          gl.uniform1f(U.uHue, U0.hue);
          gl.uniform1f(U.uExp, U0.exp * (1 + 0.18 * kick));
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          return shot;
        }

        const FLASHES = [
          [1.474, 0.45, 9],
          [8.452, 0.22, 10],
          [13.677, 0.25, 10],
          [15.07, 0.5, 14],
        ];
        function renderOverlays(t, shot) {
          let f = 0;
          for (const [t0, amp, dec] of FLASHES) if (t >= t0) f = Math.max(f, amp * Math.exp(-(t - t0) * dec));
          $("flash").style.opacity = clamp(f, 0, 1).toFixed(3);
          $("fade").style.opacity = (1 - smooth(0, 0.35, t) + smooth(15.1, 15.22, t)).toFixed(3);
          const fr = Math.round(t * FPS);
          const r = mulberry32(fr + 1);
          $("grain").style.backgroundPosition = `${Math.floor(r() * 384)}px ${Math.floor(r() * 384)}px`;
          // foreground haze drifts in front of everything
          const col = shot.sc === 2 || shot.sc === 5 ? "rgb(120,90,170)" : "rgb(150,110,190)";
          const fogOp = { 0: 0.3, 1: 0.18, 2: 0.26, 3: 0.08, 4: 0.2, 5: 0.28, 6: 0.14 }[shot.sc];
          const kick = pulse(KICKS, t, 6);
          [
            ["fog1", 22, -9, 1],
            ["fog2", -15, -14, 0.7],
          ].forEach(([id, vx, vy, k]) => {
            const el = $(id);
            el.style.backgroundColor = col;
            el.style.opacity = (fogOp * k * (0.85 + 0.3 * kick)).toFixed(3);
            el.style.transform = `translate(${((t * vx) % 1080).toFixed(1)}px,${((t * vy) % 1080).toFixed(1)}px) scale(1.1)`;
          });
        }

        function renderAt(t) {
          t = clamp(t, 0, DUR);
          const shot = drawGL(t);
          const kick = pulse(KICKS, t, 8);
          canvas.style.transform = `scale(${(1.0 + 0.004 * kick).toFixed(4)})`;
          renderFaces(t);
          renderOverlays(t, shot);
        }

        // One paused GSAP timeline; a linear proxy tween drives the procedural renderer on every seek.
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => renderAt(clock.t) }, 0);
        window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
        renderAt(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
