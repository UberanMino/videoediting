<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>UKG Code Thumbnail</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Unbounded";
        src: url("assets/fonts/unbounded-latin-900-normal.woff2") format("woff2");
        font-weight: 900;
      }
      @font-face {
        font-family: "Instrument Serif";
        src: url("assets/fonts/instrument-serif-latin-400-italic.woff2") format("woff2");
        font-style: italic;
        font-weight: 400;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("assets/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2");
        font-weight: 500;
      }

      :root {
        --black: #050508;
        --lime: #c8ff2e;
        --blue: #3048ff;
        --cyan: #7ef4ff;
        --paper: #f2f0ea;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--black);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--black);
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .layer {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }

      /* ---------- light field ---------- */
      #rings {
        filter: url(#warp);
        opacity: 0.9;
      }
      #beams {
        mix-blend-mode: screen;
        filter: blur(5px);
        opacity: 0.85;
      }

      /* ---------- mirror ball + trails ---------- */
      .ball {
        position: absolute;
        left: 930px;
        top: 70px;
        width: 760px;
        height: 760px;
      }
      #string {
        position: absolute;
        left: 1309px;
        top: -20px;
        width: 3px;
        height: 180px;
        background: linear-gradient(180deg, rgba(242, 240, 234, 0.1), rgba(242, 240, 234, 0.55));
      }
      #trail-1 {
        opacity: 0.55;
        filter: blur(1.5px) saturate(1.4);
      }
      #trail-2 {
        opacity: 0.32;
        filter: blur(4px) hue-rotate(40deg) saturate(1.6);
      }
      #trail-3 {
        opacity: 0.16;
        filter: blur(8px) hue-rotate(80deg) saturate(1.8);
      }

      #shade {
        background:
          linear-gradient(90deg, rgba(5, 5, 8, 0.82) 0%, rgba(5, 5, 8, 0.55) 34%, rgba(5, 5, 8, 0) 58%),
          linear-gradient(0deg, rgba(5, 5, 8, 0.7) 0%, rgba(5, 5, 8, 0) 45%);
      }

      /* ---------- finish ---------- */
      #vignette {
        background: radial-gradient(ellipse at 62% 42%, rgba(0, 0, 0, 0) 38%, rgba(0, 0, 0, 0.78) 100%);
      }
      #grain {
        mix-blend-mode: overlay;
        opacity: 0.32;
        image-rendering: pixelated;
      }

      /* ---------- type ---------- */
      .kicker {
        position: absolute;
        left: 96px;
        top: 652px;
        font-family: "Instrument Serif", serif;
        font-style: italic;
        font-size: 64px;
        line-height: 1;
        color: var(--paper);
        white-space: nowrap;
      }
      .title-wrap {
        position: absolute;
        left: 80px;
        top: 700px;
        width: 1200px;
        height: 330px;
      }
      .title {
        position: absolute;
        left: 0;
        top: 0;
        font-family: "Unbounded", sans-serif;
        font-weight: 900;
        font-size: 272px;
        line-height: 1.1;
        letter-spacing: -0.055em;
        white-space: nowrap;
      }
      #title-main {
        color: var(--paper);
      }
      #ghost-lime {
        color: var(--lime);
        mix-blend-mode: screen;
      }
      #ghost-blue {
        color: var(--blue);
        mix-blend-mode: screen;
      }
      .meta {
        position: absolute;
        font-family: "JetBrains Mono", monospace;
        font-weight: 500;
        font-size: 22px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--paper);
        white-space: nowrap;
      }
      #meta-tl {
        left: 96px;
        top: 80px;
      }
      #meta-tl .dot {
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-right: 18px;
        border-radius: 50%;
        background: var(--lime);
        box-shadow: 0 0 18px var(--lime);
      }
      #meta-tr {
        right: 96px;
        top: 80px;
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <filter id="warp" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.0032 0.0042" numOctaves="2" seed="7" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="170" xChannelSelector="R" yChannelSelector="G" result="warped" />
          <feGaussianBlur in="warped" stdDeviation="2.2" />
        </filter>
      </defs>
    </svg>

    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3"
      data-width="1920"
      data-height="1080"
    >
      <section id="scene-light" class="clip" data-start="0" data-duration="3" data-track-index="0">
        <canvas id="rings" class="layer" width="1920" height="1080" data-layout-allow-overflow></canvas>
        <canvas id="beams" class="layer" width="1920" height="1080" data-layout-allow-overflow></canvas>
        <div id="shade" class="layer"></div>
      </section>

      <section id="scene-ball" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <canvas id="trail-3" class="ball trail" width="760" height="760" data-layout-allow-overflow></canvas>
        <canvas id="trail-2" class="ball trail" width="760" height="760" data-layout-allow-overflow></canvas>
        <canvas id="trail-1" class="ball trail" width="760" height="760" data-layout-allow-overflow></canvas>
        <div id="string" data-layout-allow-overflow></div>
        <canvas id="ball-main" class="ball" width="760" height="760" data-layout-allow-overflow></canvas>
      </section>

      <section id="scene-finish" class="clip" data-start="0" data-duration="3" data-track-index="2">
        <div id="vignette" class="layer"></div>
        <canvas id="grain" class="layer" width="960" height="540" data-layout-ignore></canvas>
      </section>

      <section id="scene-type" class="clip" data-start="0" data-duration="3" data-track-index="3">
        <div class="meta" id="meta-tl"><span class="dot"></span>UK Garage / House / Club</div>
        <div class="meta" id="meta-tr">Type Beat — 2026</div>
        <div class="kicker" id="kicker" data-layout-allow-overlap>uk garage x house type beat</div>
        <div class="title-wrap" id="title-wrap">
          <div class="title" id="ghost-blue" aria-hidden="true" data-layout-ignore>dizzy</div>
          <div class="title" id="ghost-lime" aria-hidden="true" data-layout-ignore>dizzy</div>
          <div class="title" id="title-main">dizzy</div>
        </div>
      </section>

    </div>

    <script>
      // ---------- deterministic helpers ----------
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const norm = (v) => {
        const l = Math.hypot(v[0], v[1], v[2]);
        return [v[0] / l, v[1] / l, v[2] / l];
      };
      const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];

      const BALL_CX = 930 + 380;
      const BALL_CY = 70 + 380;

      // ---------- op-art rings (warped by the SVG filter) ----------
      (function drawRings() {
        const c = document.getElementById("rings").getContext("2d");
        c.fillStyle = "#050508";
        c.fillRect(0, 0, 1920, 1080);
        const stops = [
          [0, [48, 72, 255]],
          [420, [30, 40, 150]],
          [760, [110, 150, 20]],
          [1100, [20, 26, 70]],
          [1700, [8, 8, 14]],
        ];
        const colorAt = (r) => {
          for (let i = 0; i < stops.length - 1; i++) {
            const [r0, c0] = stops[i];
            const [r1, c1] = stops[i + 1];
            if (r <= r1) {
              const t = (r - r0) / (r1 - r0);
              return c0.map((v, k) => Math.round(v + (c1[k] - v) * t));
            }
          }
          return stops[stops.length - 1][1];
        };
        for (let r = 1700; r > 0; r -= 24) {
          const [cr, cg, cb] = colorAt(r);
          c.beginPath();
          c.arc(BALL_CX, BALL_CY, r, 0, Math.PI * 2);
          c.lineWidth = 8;
          c.strokeStyle = `rgba(${cr},${cg},${cb},0.85)`;
          c.stroke();
        }
        const glow = c.createRadialGradient(BALL_CX, BALL_CY, 0, BALL_CX, BALL_CY, 720);
        glow.addColorStop(0, "rgba(120,150,255,0.55)");
        glow.addColorStop(0.5, "rgba(60,80,255,0.18)");
        glow.addColorStop(1, "rgba(0,0,0,0)");
        c.fillStyle = glow;
        c.fillRect(0, 0, 1920, 1080);
      })();

      // ---------- light beams thrown by the ball ----------
      (function drawBeams() {
        const c = document.getElementById("beams").getContext("2d");
        c.globalCompositeOperation = "lighter";
        const rnd = mulberry32(42);
        const cols = ["200,255,46", "126,244,255", "255,255,255", "90,110,255"];
        for (let i = 0; i < 22; i++) {
          const a = rnd() * Math.PI * 2;
          const len = 900 + rnd() * 1100;
          const w = 0.012 + rnd() * 0.03;
          const col = cols[i % cols.length];
          const g = c.createLinearGradient(BALL_CX, BALL_CY, BALL_CX + Math.cos(a) * len, BALL_CY + Math.sin(a) * len);
          g.addColorStop(0, `rgba(${col},0.0)`);
          g.addColorStop(0.18, `rgba(${col},${0.12 + rnd() * 0.16})`);
          g.addColorStop(1, `rgba(${col},0)`);
          c.fillStyle = g;
          c.beginPath();
          c.moveTo(BALL_CX, BALL_CY);
          c.lineTo(BALL_CX + Math.cos(a - w) * len, BALL_CY + Math.sin(a - w) * len);
          c.lineTo(BALL_CX + Math.cos(a + w) * len, BALL_CY + Math.sin(a + w) * len);
          c.closePath();
          c.fill();
        }
      })();

      // ---------- mirror ball ----------
      const ballCanvas = document.getElementById("ball-main");
      (function drawBall() {
        const c = ballCanvas.getContext("2d");
        const cx = 380,
          cy = 380,
          R = 300;
        const tilt = 0.42;
        const rot = 0.37;
        const rnd = mulberry32(1234);
        const lights = [
          { d: norm([-0.55, 0.75, 0.55]), col: [205, 255, 60], p: 5, k: 1.2 },
          { d: norm([0.85, -0.1, 0.45]), col: [60, 90, 255], p: 3.5, k: 1.15 },
          { d: norm([-0.35, -0.85, 0.45]), col: [126, 244, 255], p: 5, k: 0.9 },
          { d: norm([0.95, 0.55, 0.1]), col: [255, 80, 40], p: 7, k: 0.55 },
          { d: norm([0.3, 0.4, 0.9]), col: [255, 255, 255], p: 30, k: 1.6 },
        ];
        const toScreen = (lat, lon) => {
          const x = Math.cos(lat) * Math.sin(lon);
          const y = Math.sin(lat);
          const z = Math.cos(lat) * Math.cos(lon);
          const y2 = y * Math.cos(tilt) - z * Math.sin(tilt);
          const z2 = y * Math.sin(tilt) + z * Math.cos(tilt);
          return [x, y2, z2];
        };

        // body
        const body = c.createRadialGradient(cx - 90, cy - 110, 20, cx, cy, R);
        body.addColorStop(0, "#1b1d2c");
        body.addColorStop(1, "#040406");
        c.fillStyle = body;
        c.beginPath();
        c.arc(cx, cy, R, 0, Math.PI * 2);
        c.fill();

        const flares = [];
        const nLat = 34;
        for (let i = 0; i < nLat; i++) {
          const lat0 = -Math.PI / 2 + (i * Math.PI) / nLat;
          const lat1 = lat0 + Math.PI / nLat;
          const latM = (lat0 + lat1) / 2;
          const nLon = Math.max(6, Math.round(2 * nLat * Math.cos(latM)));
          for (let j = 0; j < nLon; j++) {
            const lon0 = (j * 2 * Math.PI) / nLon + rot;
            const lon1 = lon0 + (2 * Math.PI) / nLon;
            const lonM = (lon0 + lon1) / 2;
            const n = toScreen(latM, lonM);
            const tileRnd = rnd();
            if (n[2] <= 0.03) continue;
            const inset = 0.13;
            const la = lat0 + (lat1 - lat0) * inset,
              lb = lat1 - (lat1 - lat0) * inset;
            const oa = lon0 + (lon1 - lon0) * inset,
              ob = lon1 - (lon1 - lon0) * inset;
            const pts = [
              toScreen(la, oa),
              toScreen(la, ob),
              toScreen(lb, ob),
              toScreen(lb, oa),
            ].map((p) => [cx + R * p[0], cy - R * p[1]]);

            // mirror reflection of the view ray
            const V = [0, 0, 1];
            const nd = dot(n, V);
            const refl = [2 * nd * n[0] - V[0], 2 * nd * n[1] - V[1], 2 * nd * n[2] - V[2]];
            const base = 26 + tileRnd * 70;
            let col = [base, base, base * 1.2];
            let peak = 0;
            for (const L of lights) {
              const s = Math.pow(Math.max(0, dot(refl, L.d)), L.p) * L.k;
              peak = Math.max(peak, s);
              col = col.map((v, k) => v + L.col[k] * s);
            }
            // a few tiles catch a stray light
            if (tileRnd > 0.93) col = col.map((v, k) => v + [200, 255, 80][k] * 0.55);
            const edge = 0.35 + 0.65 * Math.pow(n[2], 0.6);
            col = col.map((v) => Math.min(255, Math.round(v * edge)));
            c.fillStyle = `rgb(${col[0]},${col[1]},${col[2]})`;
            c.beginPath();
            c.moveTo(pts[0][0], pts[0][1]);
            for (let k = 1; k < 4; k++) c.lineTo(pts[k][0], pts[k][1]);
            c.closePath();
            c.fill();
            if (peak > 0.82 && n[2] > 0.25) flares.push([cx + R * n[0], cy - R * n[1], peak]);
          }
        }

        // rim light
        const rim = c.createRadialGradient(cx, cy, R * 0.82, cx, cy, R * 1.02);
        rim.addColorStop(0, "rgba(126,244,255,0)");
        rim.addColorStop(0.8, "rgba(126,244,255,0.10)");
        rim.addColorStop(1, "rgba(126,244,255,0)");
        c.fillStyle = rim;
        c.beginPath();
        c.arc(cx, cy, R * 1.02, 0, Math.PI * 2);
        c.fill();

        // star flares on the hottest tiles
        c.globalCompositeOperation = "lighter";
        const picks = flares.sort((a, b) => b[2] - a[2]).filter((_, i) => i % 3 === 0).slice(0, 7);
        picks.forEach(([x, y], i) => {
          const size = i === 0 ? 150 : 60 + (i % 3) * 22;
          const g = c.createRadialGradient(x, y, 0, x, y, size * 0.45);
          g.addColorStop(0, "rgba(255,255,255,0.95)");
          g.addColorStop(0.25, "rgba(220,255,170,0.35)");
          g.addColorStop(1, "rgba(0,0,0,0)");
          c.fillStyle = g;
          c.fillRect(x - size, y - size, size * 2, size * 2);
          const line = (dx, dy, len, w) => {
            const lg = c.createLinearGradient(x - dx * len, y - dy * len, x + dx * len, y + dy * len);
            lg.addColorStop(0, "rgba(255,255,255,0)");
            lg.addColorStop(0.5, "rgba(255,255,255,0.9)");
            lg.addColorStop(1, "rgba(255,255,255,0)");
            c.strokeStyle = lg;
            c.lineWidth = w;
            c.beginPath();
            c.moveTo(x - dx * len, y - dy * len);
            c.lineTo(x + dx * len, y + dy * len);
            c.stroke();
          };
          line(1, 0, size, 2.2);
          line(0, 1, size, 2.2);
          line(0.707, 0.707, size * 0.4, 1.2);
          line(0.707, -0.707, size * 0.4, 1.2);
        });
      })();

      // trails are copies of the finished ball
      ["trail-1", "trail-2", "trail-3"].forEach((id) => {
        document.getElementById(id).getContext("2d").drawImage(ballCanvas, 0, 0);
      });

      // ---------- film grain ----------
      (function drawGrain() {
        const c = document.getElementById("grain").getContext("2d");
        const img = c.createImageData(960, 540);
        const rnd = mulberry32(99);
        for (let i = 0; i < img.data.length; i += 4) {
          const v = Math.round(rnd() * 255);
          img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
          img.data[i + 3] = 255;
        }
        c.putImageData(img, 0, 0);
      })();

      // ---------- timeline ----------
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#rings", { scale: 1.18, rotation: -6 }, { scale: 1, rotation: 0, duration: 3, ease: "power2.out" }, 0);
      tl.fromTo("#beams", { opacity: 0, rotation: -14 }, { opacity: 0.85, rotation: 0, duration: 2.2, ease: "power3.out" }, 0.1);

      tl.fromTo("#ball-main", { y: -90, rotation: -10 }, { y: 0, rotation: 0, duration: 1.6, ease: "power3.out" }, 0);
      tl.fromTo("#string", { y: -90 }, { y: 0, duration: 1.6, ease: "power3.out" }, 0);
      tl.fromTo("#trail-1", { x: 0, y: -90 }, { x: -96, y: 34, rotation: -4, duration: 1.8, ease: "power3.out" }, 0.05);
      tl.fromTo("#trail-2", { x: 0, y: -90 }, { x: -196, y: 72, rotation: -8, duration: 2, ease: "power3.out" }, 0.08);
      tl.fromTo("#trail-3", { x: 0, y: -90 }, { x: -300, y: 112, rotation: -12, duration: 2.2, ease: "power3.out" }, 0.11);

      tl.fromTo("#title-main", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "power4.out" }, 0.45);
      tl.fromTo("#ghost-lime", { x: 0, opacity: 0 }, { x: -4, y: -3, opacity: 0.75, duration: 1.2, ease: "power3.out" }, 0.6);
      tl.fromTo("#ghost-blue", { x: 0, opacity: 0 }, { x: 5, y: 4, opacity: 0.9, duration: 1.2, ease: "power3.out" }, 0.6);
      tl.fromTo("#kicker", { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.8);
      tl.fromTo(".meta", { opacity: 0 }, { opacity: 1, duration: 0.6, stagger: 0.1, ease: "power2.out" }, 1.0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
