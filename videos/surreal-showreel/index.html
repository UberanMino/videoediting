      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Anton", sans-serif;
      }
      #gl {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #stage {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
      .scene {
        position: absolute;
        inset: 0;
        overflow: visible;
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      .ent {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }
      .glow {
        filter: drop-shadow(0 0 10px #fff) drop-shadow(0 0 26px rgba(255, 255, 255, 0.85));
      }

      /* slam words */
      .word {
        --ca: 6px;
        position: absolute;
        left: 0;
        width: 1080px;
        display: block;
        text-align: center;
        font-family: "Anton", sans-serif;
        font-size: 250px;
        line-height: 1;
        color: #fff;
        text-transform: uppercase;
        white-space: nowrap;
        opacity: 0;
        text-shadow:
          calc(var(--ca) * -1) 0 0 #ff00c8,
          var(--ca) 0 0 #00f0ff,
          0 0 36px rgba(255, 255, 255, 0.9),
          0 0 90px rgba(255, 120, 240, 0.6);
      }
      .word.sm {
        font-size: 170px;
      }
      .word.xl {
        font-size: 420px;
      }
      .word.dark {
        color: #0b0014;
        text-shadow:
          calc(var(--ca) * -1) 0 0 #ff2fa8,
          var(--ca) 0 0 #00c8ff,
          0 0 30px rgba(255, 255, 255, 1),
          0 0 60px rgba(255, 255, 255, 1);
      }
      .word.acid {
        color: #b6ff00;
        text-shadow:
          calc(var(--ca) * -1) 0 0 #7a00ff,
          var(--ca) 0 0 #ff00a0,
          0 0 40px rgba(182, 255, 0, 0.9);
      }
      .word.chrome {
        color: transparent;
        background: linear-gradient(180deg, #ffffff 0%, #bfe9ff 38%, #3a1c71 50%, #ff9ff3 62%, #ffffff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        text-shadow: none;
        filter: drop-shadow(calc(var(--ca) * -1) 0 0 #ff00c8) drop-shadow(var(--ca) 0 0 #00f0ff)
          drop-shadow(0 0 30px rgba(255, 255, 255, 0.8));
      }
      .word .ch {
        display: inline-block;
        transform-origin: 50% 0%;
      }
      .melt {
        filter: url(#melt);
      }

      /* 3D cube */
      .cube-wrap {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        perspective: 1500px;
        perspective-origin: 50% 46%;
      }
      .cube {
        position: absolute;
        left: 310px;
        top: 650px;
        width: 460px;
        height: 460px;
        transform-style: preserve-3d;
      }
      .cf {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 8px solid #fff;
        font-family: "Anton", sans-serif;
        font-size: 150px;
        color: #fff;
        text-shadow:
          -5px 0 0 #ff00c8,
          5px 0 0 #00f0ff,
          0 0 30px #fff;
        box-shadow:
          0 0 40px rgba(255, 255, 255, 0.8),
          inset 0 0 60px rgba(255, 255, 255, 0.5);
      }

      /* mirror quads */
      .quad {
        position: absolute;
        width: 540px;
        height: 960px;
        overflow: hidden;
      }
      .shock {
        position: absolute;
        left: 290px;
        top: 650px;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        border: 18px solid #fff;
        box-shadow:
          0 0 40px #fff,
          inset 0 0 40px #fff;
        opacity: 0;
      }

      /* overlays */
      #grain,
      #vig,
      #flash {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #grain {
        opacity: 0.2;
        mix-blend-mode: overlay;
        background-size: 384px 384px;
      }
      #vig {
        background: radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.45) 100%);
      }
      #flash {
        background: #fff;
        opacity: 0;
      }
      .hud {
        position: absolute;
        font-family: "Rubik Mono One", monospace;
        font-size: 26px;
        line-height: 1;
        color: #fff;
        letter-spacing: 1px;
        text-shadow:

    </style>

    <script>
      (function () {
        const DUR = 9.056;
        const FPS = 30;
        const NS = "http://www.w3.org/2000/svg";

        // ---------- timing (from audiomap.json, 143.6 BPM) ----------
        const BEATS = [
          -0.348, 0.07, 0.488, 0.906, 1.3, 1.695, 2.113, 2.531, 2.926, 3.344, 3.738, 4.156, 4.551,
          4.969, 5.387, 5.782, 6.2, 6.594, 7.012, 7.43, 7.825, 8.243, 8.638, 9.056,
        ];
        const Q = 0.1045; // quarter beat

        const SCENES = [
          { id: "A", s: 0, e: 0.906, mode: 0, fx: "FX_01 // ECHO TRAILS" },
          { id: "B", s: 0.906, e: 1.695, mode: 1, fx: "FX_02 // KALEIDOSCOPE" },
          { id: "C", s: 1.695, e: 2.113, mode: 6, fx: "FX_03 // STROBE CUTS" },
          { id: "D", s: 2.113, e: 2.926, mode: 2, fx: "FX_04 // EYE TUNNEL" },
          { id: "E", s: 2.926, e: 3.738, mode: 6, fx: "FX_05 // VERTIGO SPIRAL" },
          { id: "F", s: 3.738, e: 4.551, mode: 3, fx: "FX_06 // LIQUID MELT" },
          { id: "G", s: 4.551, e: 5.387, mode: 1, fx: "FX_07 // CSS 3D" },
          { id: "H", s: 5.387, e: 6.2, mode: 0, fx: "FX_08 // MIRROR MADNESS" },
          { id: "I", s: 6.2, e: 7.012, mode: 5, fx: "FX_09 // OVEREXPOSED" },
          { id: "J", s: 7.012, e: 7.825, mode: 4, fx: "FX_10 // JULIA ZOOM" },
          { id: "K", s: 7.825, e: 8.638, mode: 3, fx: "FX_11 // RECAP" },
          { id: "L", s: 8.638, e: DUR + 1, mode: 7, fx: "FX_12 // THE END?" },
        ];
        // in-shader transitions: type 0 fade, 1 iris circle, 2 glitch slices, 3 swirl dissolve
        const TRANS = [
          { s: 2.86, e: 2.99, a: 2, b: 6, type: 3 },
          { s: 3.68, e: 3.8, a: 6, b: 3, type: 2 },
          { s: 4.49, e: 4.6, a: 3, b: 1, type: 1, c: [0, 0.02] },
          { s: 6.08, e: 6.26, a: 0, b: 5, type: 0 },
          { s: 6.94, e: 7.06, a: 5, b: 4, type: 1, c: [0, 0.05] },
          { s: 8.58, e: 8.7, a: 3, b: 7, type: 2 },
        ];
        const FLASHES = [
          [0, 1, 9],
          [0.906, 0.55, 10],
          [2.113, 1, 5],
          [3.738, 0.35, 12],
          [5.387, 0.6, 10],
          [7.012, 0.6, 10],
          [8.638, 0.8, 8],
        ];
        const JULIA_TARGET = [0.381, -0.5862];

        // ---------- helpers ----------
        function mulberry32(a) {
          return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        const rnd = mulberry32(1337);
        const hash1 = (n) => {
          const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
          return x - Math.floor(x);
        };
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, k) => a + (b - a) * k;
        const smooth = (a, b, x) => {
          const k = clamp((x - a) / (b - a), 0, 1);
          return k * k * (3 - 2 * k);
        };
        const easeInOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
        function lastBeat(t) {
          let b = BEATS[0];
          for (const x of BEATS) if (x <= t + 1e-6) b = x;
          return b;
        }
        function beatIndex(t) {
          let i = 0;
          for (let k = 0; k < BEATS.length; k++) if (BEATS[k] <= t + 1e-6) i = k;
          return i;
        }
        const pulse = (t, decay = 9) => Math.exp(-(t - lastBeat(t)) * decay);
        function sceneAt(t) {
          for (const s of SCENES) if (t >= s.s && t < s.e) return s;
          return SCENES[SCENES.length - 1];
        }
        function sv(tag, attrs, parent) {
          const e = document.createElementNS(NS, tag);
          for (const k in attrs) e.setAttribute(k, attrs[k]);
          if (parent) parent.appendChild(e);
          return e;
        }
        const $ = (id) => document.getElementById(id);
        let UID = 0;

        // ---------- procedural characters ----------
        const FACEPAL = [
          ["#ffd9b8", "#ff7a3d", "#3b1500"],
          ["#ffc2ec", "#ff2fa8", "#2a0040"],
          ["#c9fff0", "#00d9a3", "#003b2e"],
          ["#fff49a", "#ffae00", "#5a1d00"],
          ["#dccbff", "#7a3dff", "#12002e"],
          ["#bfe6ff", "#1f8cff", "#001a40"],
        ];

        function makeFace(pi, size) {
          const P = FACEPAL[pi % FACEPAL.length];
          const id = "fg" + UID++;
          const svg = sv("svg", { viewBox: "-130 -150 260 300", width: size, height: size * (300 / 260) });
          svg.classList.add("ent");
          const defs = sv("defs", {}, svg);
          const g = sv("radialGradient", { id, cx: "40%", cy: "35%", r: "75%" }, defs);
          sv("stop", { offset: "0%", "stop-color": P[0] }, g);
          sv("stop", { offset: "100%", "stop-color": P[1] }, g);
          sv("ellipse", { cx: -97, cy: 8, rx: 18, ry: 27, fill: P[1] }, svg);
          sv("ellipse", { cx: 97, cy: 8, rx: 18, ry: 27, fill: P[1] }, svg);
          sv("ellipse", { cx: 0, cy: 0, rx: 95, ry: 112, fill: `url(#${id})` }, svg);
          sv(
            "path",
            {
              d: "M-92,-48 L-84,-112 L-58,-82 L-44,-138 L-18,-96 L4,-146 L24,-98 L50,-134 L60,-86 L88,-114 L93,-48 Q0,-92 -92,-48Z",
              fill: P[2],
            },
            svg,
          );
          const bl = sv("rect", { x: -64, y: -64, width: 48, height: 12, rx: 6, fill: P[2] }, svg);
          const br = sv("rect", { x: 16, y: -66, width: 48, height: 12, rx: 6, fill: P[2] }, svg);
          const eL = sv("g", { transform: "translate(-38,-22)" }, svg);
          sv("circle", { r: 31, fill: "#fff", stroke: "#1a0010", "stroke-width": 3 }, eL);
          const pL = sv("circle", { r: 12, fill: "#0a0010" }, eL);
          const eR = sv("g", { transform: "translate(40,-26)" }, svg);
          sv("circle", { r: 23, fill: "#fff", stroke: "#1a0010", "stroke-width": 3 }, eR);
          const pR = sv("circle", { r: 9, fill: "#0a0010" }, eR);
          sv("ellipse", { cx: 0, cy: 18, rx: 13, ry: 9, fill: P[1] }, svg);
          const mg = sv("g", { transform: "translate(0,60)" }, svg);
          const mouth = sv("ellipse", { cx: 0, cy: 0, rx: 46, ry: 20, fill: "#2a000c" }, mg);
          const teeth = sv("ellipse", { cx: 0, cy: -14, rx: 34, ry: 7, fill: "#fff" }, mg);
          const tongue = sv("ellipse", { cx: 0, cy: 10, rx: 26, ry: 7, fill: "#ff4d7a" }, mg);
          const gl = sv("g", { opacity: 0 }, svg);
          sv("rect", { x: -80, y: -52, width: 70, height: 46, rx: 14, fill: "#050008" }, gl);
          sv("rect", { x: 8, y: -52, width: 70, height: 46, rx: 14, fill: "#050008" }, gl);
          sv("rect", { x: -12, y: -38, width: 24, height: 7, fill: "#050008" }, gl);
          sv("path", { d: "M-70,-44 L-52,-44 M18,-44 L36,-44", stroke: "#fff", "stroke-width": 6, "stroke-linecap": "round" }, gl);
          return {
            el: svg,
            size,
            set(st) {

          if (sc.id === "L") rz = 0;
          $("stage").style.transform = `translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px) rotate(${rz.toFixed(2)}deg) scale(${s.toFixed(4)})`;
          canvas.style.transform = `translate(${(sx * 0.5).toFixed(1)}px,${(sy * 0.5).toFixed(1)}px) scale(${(1.06 + 0.04 * bp).toFixed(4)})`;
        }

        function renderOverlays(t) {
          let f = 0;
          for (const [t0, amp, dec] of FLASHES) if (t >= t0) f = Math.max(f, amp * Math.exp(-(t - t0) * dec));
          $("flash").style.opacity = clamp(f, 0, 1).toFixed(3);
          const fr = Math.round(t * FPS);
          const r = mulberry32(fr + 1);
          $("grain").style.backgroundPosition = `${Math.floor(r() * 384)}px ${Math.floor(r() * 384)}px`;
          const ss = Math.floor(fr / FPS),
            ff = fr % FPS;
          $("hud-tc").textContent = `00:00:${String(ss).padStart(2, "0")}:${String(ff).padStart(2, "0")}`;
          $("hud-fx").textContent = sceneAt(t).fx;
          $("rec-dot").style.opacity = Math.floor(t * 2.4) % 2 ? "0.25" : "1";
        }

        function renderAt(t) {
          t = clamp(t, 0, DUR);
          drawGL(t);
          renderCam(t);
          renderWords(t);
          renderA(t);
          renderB(t);
          renderC(t);
          renderD(t);
          renderE(t);
          renderF(t);
          renderG(t);
          renderH(t);
          renderI(t);
          renderJ(t);
          renderK(t);
          renderL(t);
          renderOverlays(t);
        }

        // One paused GSAP timeline; a linear proxy tween drives the procedural renderer on every seek.
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => renderAt(clock.t) }, 0);
        window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
        renderAt(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
