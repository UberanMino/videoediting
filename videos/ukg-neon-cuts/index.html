<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>UKG Neon Cuts</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
      .slot,
      .hold {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
      #gl,
      #glB {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
      .car {
        position: absolute;
        left: 40px;
        top: 700px;
        width: 1000px;
        height: 720px;
        transform-origin: 50% 40%;
      }
      .card {
        position: absolute;
        left: 0;
        top: 0;
        width: 560px;
        height: 560px;
        opacity: 0;
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.85),
          0 0 0 3px rgba(255, 255, 255, 0.08);
        transform-origin: 50% 50%;
      }
      .card canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #grain,
      #flash {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #grain {
        opacity: 0.16;
        mix-blend-mode: overlay;
        background-size: 320px 320px;
      }
      #fade {
        position: absolute;
        inset: 0;
        background: #000;
        pointer-events: none;
      }
      #flash {
        opacity: 0;
        mix-blend-mode: screen;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="7"
      data-width="1080"
      data-height="1920"
    >
      <svg width="0" height="0" style="position: absolute">
        <filter id="duo" color-interpolation-filters="sRGB">
          <feColorMatrix type="matrix" values="0.299 0.587 0.114 0 0  0.299 0.587 0.114 0 0  0.299 0.587 0.114 0 0  0 0 0 1 0" />
          <feComponentTransfer>
            <feFuncR id="duoR" type="table" tableValues="0 1" />
            <feFuncG id="duoG" type="table" tableValues="0 1" />
            <feFuncB id="duoB" type="table" tableValues="0 1" />
          </feComponentTransfer>
        </filter>
        <filter id="mblur" x="-10%" y="-10%" width="120%" height="120%">
          <feGaussianBlur id="mblurG" stdDeviation="0 0" />
        </filter>
      </svg>

      <div id="stage" data-layout-allow-overflow>
        <div class="slot" id="slotA"><canvas id="gl" width="720" height="1280"></canvas><div class="hold" id="holdA"></div></div>
        <div class="slot" id="slotB"><canvas id="glB" width="720" height="1280"></canvas><div class="hold" id="holdB"></div></div>
      </div>

      <div id="grain"></div>
      <div id="flash"></div>
      <div id="fade"></div>

      <audio id="beat" src="assets/beat7.m4a" data-start="0" data-duration="7" data-track-index="11"></audio>
    </div>

    <script>
      (function () {
        const DUR = 7.0;
        const FPS = 30;
        const NS = "http://www.w3.org/2000/svg";
        const $ = (id) => document.getElementById(id);

        // ---------- timing: beat window 1.40–8.40s of the track, 136 BPM 2-step ----------
        const BEATS = [-0.355, 0.086, 0.527, 0.968, 1.386, 1.828, 2.269, 2.71, 3.128, 3.569, 4.01, 4.451, 4.869, 5.311, 5.729, 6.17, 6.611, 7.052];
        const KICKS = [0.074, 0.945, 2.269, 3.14, 3.569, 4.405, 5.752, 6.146, 6.588];
        const HITS = [0.516, 1.386, 2.048, 2.246, 2.478, 2.698, 3.116, 3.337, 3.569, 3.79, 3.987, 4.219, 4.579, 4.858, 5.299, 5.531, 5.729, 5.961, 6.17, 6.599];

        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, k) => a + (b - a) * k;
        const smooth = (a, b, x) => {
          const k = clamp((x - a) / (b - a), 0, 1);
          return k * k * (3 - 2 * k);
        };
        const easeOut = (k) => 1 - Math.pow(1 - clamp(k, 0, 1), 3);
        function pulse(list, t, decay) {
          let v = 0;
          for (const x of list) {
            if (x > t + 1e-6) break;
            v = Math.max(v, Math.exp(-(t - x) * decay));
          }
          return v;
        }
        function beatPhase(t) {
          let i = 0;
          for (let k = 0; k < BEATS.length - 1; k++) if (BEATS[k] <= t + 1e-6) i = k;
          return clamp((t - BEATS[i]) / (BEATS[i + 1] - BEATS[i]), 0, 1);
        }
        function mulberry32(a) {
          return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        // ---------- colour treatments (dark · saturated · highlight), mapped from luminance ----------
        const PAL = {
          GREEN: [[0.02, 0.28, 0.0], [0.22, 1.0, 0.06], [0.9, 1.0, 0.62]],
          ACID: [[0.12, 0.22, 0.0], [0.66, 1.0, 0.0], [1.0, 1.0, 0.78]],
          PINK: [[0.32, 0.0, 0.2], [1.0, 0.07, 0.62], [1.0, 0.8, 0.96]],
          RED: [[0.34, 0.0, 0.0], [1.0, 0.02, 0.05], [1.0, 0.74, 0.62]],
          PURPLE: [[0.2, 0.0, 0.32], [0.74, 0.22, 1.0], [0.98, 0.86, 1.0]],
          SPLIT: [[0.04, 0.1, 0.95], [0.58, 1.0, 0.08], [0.96, 1.0, 0.66]],
        };
        function ramp(pal, l) {
          const P = PAL[pal];
          l = clamp(l, 0, 1);
          if (l < 0.33) return P[0].map((c) => (c * l) / 0.33);
          if (l < 0.7) return P[0].map((c, i) => lerp(c, P[1][i], (l - 0.33) / 0.37));
          return P[1].map((c, i) => lerp(c, P[2][i], (l - 0.7) / 0.3));
        }
        let lastDuo = "";
        function setDuo(pal) {
          if (pal === lastDuo) return;
          lastDuo = pal;
          const R = [],
            G = [],
            B = [];
          for (let i = 0; i <= 16; i++) {
            const c = ramp(pal, i / 16);
            R.push(c[0].toFixed(3));
            G.push(c[1].toFixed(3));
            B.push(c[2].toFixed(3));
          }
          $("duoR").setAttribute("tableValues", R.join(" "));
          $("duoG").setAttribute("tableValues", G.join(" "));
          $("duoB").setAttribute("tableValues", B.join(" "));
        }

        // ---------- scene presets: build shader uniforms for a named scene ----------
        // scene ids: 0 BG · 1 LIPS · 2 PHONE · 3 ROTARY · 4 SHADES · 5 LIPSTICK · 6 CHILI · 7 DISCO · 8 ACID · 9 TUNNEL
        function euler(rx, ry, rz) {
          const cx = Math.cos(rx), sx = Math.sin(rx), cy = Math.cos(ry), sy = Math.sin(ry), cz = Math.cos(rz), sz = Math.sin(rz);
          // R = Rz*Ry*Rx (object → world); pass world → object = R^T, column-major
          const R = [
            [cz * cy, cz * sy * sx - sz * cx, cz * sy * cx + sz * sx],
            [sz * cy, sz * sy * sx + cz * cx, sz * sy * cx - cz * sx],
            [-sy, cy * sx, cy * cx],
          ];
          // M = R^T ; column-major of M = row-major of R
          return [R[0][0], R[0][1], R[0][2], R[1][0], R[1][1], R[1][2], R[2][0], R[2][1], R[2][2]];
        }
        function preset(name, l, t, o = {}) {
          const U = { sc: 0, pal: o.pal || "GREEN", zoom: 1, rot: 0, pan: [0, 0], kal: 0, mirror: 0, glitch: 0, inv: 0, ca: 0, M: euler(0, 0, 0), obj: [0, 0, 0], A: [0, 0, 0, 4], B: [0, 0, 0, 2] };
          const hit = pulse(HITS, t, 12);
          switch (name) {
            case "BLACK":
              U.sc = 0;
              U.A = [0, 0, 0, 0];
              break;
            case "LIPS":
              U.sc = 1;
              U.A = [0.02 + 0.07 * (0.5 + 0.5 * Math.sin(t * 9)) + 0.05 * hit, 0, 0, 0];
              U.zoom = 1.0 + l * 0.35;
              U.rot = Math.sin(t * 3) * 0.06;
              break;
            case "PHONE":
              U.sc = 2;
              U.M = euler(0.18 + Math.sin(t * 2) * 0.1, l * 4.2 - 0.8, 0.28 + Math.sin(t * 3) * 0.1);
              U.obj = [0, -0.33, 0];
              U.A = [0, 0, 0, 4.3];
              U.B = [0, 0, 0, 1.9];
              break;
            case "ROTARY":
              U.sc = 3;
              U.M = euler(0.38, -0.5 + l * 1.4, 0.05);
              U.obj = [0, -0.05, 0];
              U.A = [0.22 * Math.max(0, Math.sin(Math.min(l * 7, Math.PI))), l * 9, 0, 4.2];
              U.B = [0, 0, 0, 1.4];
              break;
            case "SHADES":
              U.sc = 4;
              U.M = euler(0.25 + Math.sin(t * 2.3) * 0.15, -0.7 + l * 3.4, -0.18 + Math.sin(t * 1.7) * 0.12);
              U.obj = [0, 0, 0];
              U.A = [0, 0, 0, 5.2];
              U.B = [o.bg || 0, 0, 0, 1.55];
              break;
            case "LIPSTICK":
              U.sc = 5;
              U.M = euler(0.3, l * 2.5, 0.35);
              U.obj = [0, -0.25, 0];
              U.A = [0.12 + 0.55 * easeOut(l / 0.2), 0, 0, 3.6];
              U.B = [0, 0, 0, 1.25];
              break;
            case "CHILI":
              U.sc = 6;
              U.pan = [l * 0.9, l * 0.5];
              U.rot = 0.2;
              U.A = [0, 0, 0, 3.2];
              U.B = [0, 0, 0, 60];
              break;
            case "DISCO":
              U.sc = 7;
              U.A = [0, 0.02, 0.22, 0.9];
              U.zoom = 1.05 + l * 0.2;
              break;
            case "ACID":
              U.sc = 8;
              U.zoom = 1 + l * 0.3;
              U.rot = l * 0.4;
              break;
            case "TUNNEL":
              U.sc = 9;
              U.A = [3.5, 0, 0, 0];
              break;
          }
          U.zoom *= 1 + 0.05 * hit;
          Object.assign(U, o.set || {});
          return U;
        }

        // ---------- shot list: one to two beats per shot, every change is a transition on the beat ----------
        const SHOTS = [
          { s: 0.0, e: 0.968, name: "LIPS", pal: "ACID" },
          { s: 0.968, e: 1.828, name: "PHONE", pal: "GREEN" },
          { s: 1.828, e: 2.71, name: "TUNNEL", pal: "SPLIT", car: 1 },
          { s: 2.71, e: 3.569, name: "DISCO", pal: "PINK" },
          { s: 3.569, e: 4.451, name: "ROTARY", pal: "RED" },
          { s: 4.451, e: 5.311, name: "SHADES", pal: "PURPLE", bg: 1 },
          { s: 5.311, e: 5.729, name: "CHILI", pal: "RED" },
          { s: 5.729, e: 6.611, name: "ACID", pal: "PURPLE", collage: 1, set: { zoom: 0.7 } },
          { s: 6.611, e: 7.01, name: "LIPSTICK", pal: "PINK" },
        ];
        // transition into SHOTS[i], centred on its start beat
        const TRANS = { 1: ["zoom", 0.32], 2: ["whip", 0.26], 3: ["iris", 0.32], 4: ["spin", 0.3], 5: ["flash", 0.32], 6: ["push", 0.26], 7: ["iris", 0.3], 8: ["zoom", 0.32] };
        function shotIndex(t) {
          for (let i = 0; i < SHOTS.length; i++) if (t >= SHOTS[i].s && t < SHOTS[i].e) return i;
          return SHOTS.length - 1;
        }
        function shotU(sh, t) {
          const l = t - sh.s;
          const U = preset(sh.name, l, t, { pal: sh.pal, set: sh.set, bg: sh.bg });
          U.pal = sh.pal;
          U.zoom *= 1 + 0.07 * Math.max(0, l);
          return U;
        }

        // ---------- WebGL ----------
        const canvas = $("gl");
        const gl = canvas.getContext("webgl", { preserveDrawingBuffer: true, antialias: false, alpha: false });
        const VS = "attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }";
        const LIB = `
precision highp float;
uniform vec4 uVP; uniform float uT, uL, uBeat, uHit, uFrame;
uniform vec3 uC0, uC1, uC2; uniform float uInv;
uniform float uZoom, uRot, uKal, uMirror, uGlitch, uCA;
uniform vec2 uPan; uniform mat3 uM; uniform vec3 uObj; uniform vec4 uA, uB;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x), f.y); }
float fbm(vec2 p){ float v=0., a=.5; mat2 m=mat2(1.6,1.2,-1.2,1.6); for(int i=0;i<4;i++){ v+=a*noise(p); p=m*p; a*=.5; } return v; }
mat2 rot2(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
float sdRoundBox(vec3 p, vec3 b, float r){ vec3 q=abs(p)-b+r; return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-r; }
float sdCyl(vec3 p, float h, float r){ vec2 d=abs(vec2(length(p.xz),p.y))-vec2(r,h); return min(max(d.x,d.y),0.)+length(max(d,0.)); }
float sdCapsule(vec3 p, vec3 a, vec3 b, float r){ vec3 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h)-r; }
float smin(float a, float b, float k){ float h=clamp(.5+.5*(b-a)/k,0.,1.); return mix(b,a,h)-k*h*(1.-h); }
float sdRoundCone(vec3 p, float r1, float r2, float h){
  vec2 q=vec2(length(p.xz), p.y); float b=(r1-r2)/h; float a=sqrt(1.-b*b); float k=dot(q, vec2(-b,a));
  if (k < 0.) return length(q)-r1; if (k > a*h) return length(q-vec2(0.,h))-r2; return dot(q, vec2(a,b))-r1;
}
float bgLum(vec2 p){
  float l = .5 + .28*exp(-dot(p*vec2(1.,.8),p*vec2(1.,.8))*3.2) + (fbm(p*3.+uT*.2)-.5)*.06;
  if (uB.x > .5) {
    float r=length(p), a=atan(p.y,p.x); float z=.3/max(r,.01) + uT*3.;
    float ai=floor(a/6.28318*70.), fa=fract(a/6.28318*70.);
    float h=hash(vec2(ai,1.)); float seg=fract(z*.5+h*10.);
    l = .12 + step(.55,h)*smoothstep(0.,.05,seg)*smoothstep(.45,.3,seg)*exp(-(fa-.5)*(fa-.5)*30.)*.8*smoothstep(.02,.25,r) + exp(-r*5.)*.45;
  }
  return l;
}
float shade(vec3 lp, vec3 n, vec3 rd, float m){
  vec3 L=normalize(vec3(-.55,.65,.55));
  float dif=clamp(dot(n,L),0.,1.);
  float fre=pow(1.-clamp(dot(n,-rd),0.,1.),3.);
  vec3 r=reflect(rd,n);
  float spec=pow(clamp(dot(r,L),0.,1.),48.);
  float box=smoothstep(.35,.7,r.y)*smoothstep(.9,.5,abs(r.x));
  float strip=smoothstep(.16,.0,abs(r.x-.62))*smoothstep(-.4,.2,r.y);
  float base=.3, gloss=.5, emit=0.;
  if (m < 1.5) { base=.2; gloss=.6; }
  else if (m < 2.5) { base=.66; gloss=.25; }
  else if (m < 3.5) { base=.08; gloss=.25; emit=.72 + .08*sin(lp.y*260.); }
  else if (m < 4.5) { base=.32; gloss=1.15; }
  else if (m < 5.5) { base=.03; gloss=1.35; }
  else if (m < 6.5) { base=.52; gloss=.65; }
  else if (m < 7.5) { base=.45; gloss=.95; }
  else if (m < 8.5) { base=.16; gloss=.2; }
  else { base=.6; gloss=0.; }
  return base*(.22 + .9*dif) + gloss*(spec*1.15 + box*.55 + strip*.45) + fre*.3*gloss + emit;
}
// ---------- 1 · lips ----------
float lipH(vec2 q, float o, out float mat){
  float x=q.x, y=q.y; mat=0.;
  float ax=abs(x); if (ax > 1.) return 0.;
  float w=1.-x*x;
  float yt=.34*pow(w,.5) - .07*exp(-x*x*70.) + .035*exp(-pow(ax-.2,2.)*110.);
  float ym=-.015 + .04*x*x;
  float yu=ym + o*w;
  float yl=ym - o*w*.8;
  float yb=-.42*pow(w,.6) - .01;
  if (y < yt && y > yu) { float s=(y-yu)/(yt-yu); mat=1.; return pow(sin(3.14159*s),.7)*pow(w,.3); }
  if (y < yl && y > yb) { float s=(y-yb)/(yl-yb); mat=2.; return pow(sin(3.14159*s),.55)*pow(w,.3)*1.15; }
  if (y <= yu && y >= yl) { mat=3.; return 0.; }
  return 0.;
}
float sLips(vec2 p, float t){
  vec2 q=p*vec2(3.7,3.3);
  float o=uA.x;
  float m, mx, my; float e=.004;
  float h=lipH(q,o,m);
  float hx=lipH(q+vec2(e,0.),o,mx), hy=lipH(q+vec2(0.,e),o,my);
  float skin=.34 + .08*(1.-length(q*vec2(.6,1.))) + (fbm(q*14.)-.5)*.04;
  if (m < .5) {
    float sh=exp(-pow((q.y + .42*pow(max(1.-q.x*q.x,0.),.65) + .03)*9.,2.))*.12;
    return skin - sh;
  }
  if (m > 2.5) {
    return .02 + .05*(1.-abs(q.x));
  }
  vec3 n=normalize(vec3(-(hx-h)/e*.09, -(hy-h)/e*.09, 1.));
  vec3 L=normalize(vec3(-.4,.6,.7));
  float dif=clamp(dot(n,L),0.,1.);
  vec3 r=reflect(vec3(0.,0.,-1.),n);
  float spec=pow(clamp(dot(r,normalize(vec3(-.2,.45,.85))),0.,1.),60.);
  float crease=.93 + .07*sin(q.x*160. + q.y*18.)*smoothstep(.0,.25,h);
  float l=(.26 + .55*dif)*crease + spec*(m > 1.5 ? 1.25 : .8);
  return l;
}
// ---------- 2 · brick phone ----------
vec2 mapPhone(vec3 p){
  float body=sdRoundBox(p, vec3(.3,.78,.14), .07);
  float scr=sdRoundBox(p - vec3(0.,.38,.15), vec3(.2,.13,.035), .02);
  vec2 res=vec2(max(body,-scr), 1.);
  float screen=sdRoundBox(p - vec3(0.,.38,.118), vec3(.19,.12,.01), .01);
  if (screen < res.x) res=vec2(screen, 3.);
  vec3 q=p - vec3(0.,-.3,.15);
  vec2 id=clamp(floor(q.xy/vec2(.16,.13)+.5), vec2(-1.,-2.), vec2(1.,1.));
  q.xy -= id*vec2(.16,.13);
  float keys=sdRoundBox(q, vec3(.058,.038,.028), .02);
  if (keys < res.x) res=vec2(keys, 2.);
  float ear=sdRoundBox(p - vec3(0.,.66,.145), vec3(.12,.03,.02), .02);
  if (ear < res.x) res=vec2(ear, 2.);
  float ant=min(sdCapsule(p, vec3(.18,.78,0.), vec3(.18,1.45,0.), .03), length(p-vec3(.18,1.47,0.))-.055);
  if (ant < res.x) res=vec2(ant, 4.);
  return res;
}
// ---------- 3 · rotary phone ----------
vec2 mapRotary(vec3 p){
  vec3 q=p; float tp=1. - .24*clamp(q.y+.3,0.,1.); q.xz/=tp;
  float base=sdRoundBox(q - vec3(0.,-.18,0.), vec3(.74,.26,.58), .2)*tp;
  vec2 res=vec2(base, 1.);
  vec3 dp=p - vec3(0.,.04,.58); dp.yz=rot2(-.8)*dp.yz;
  float plate=sdCyl(dp, .04, .34);
  vec3 hp=dp; hp.xz=rot2(uA.y)*hp.xz;
  float an=atan(hp.z,hp.x); float seg=6.28318/10.; float ai=floor(an/seg+.5);
  vec2 hc=rot2(ai*seg)*hp.xz;
  float hole=max(length(hc - vec2(.245,0.)) - .052, abs(dp.y)-.2);
  plate=max(plate, -hole);
  float dial=max(sdCyl(dp - vec3(0.,.02,0.), .02, .3), -hole);
  if (plate < res.x) res=vec2(plate, 4.);
  if (dial < res.x) res=vec2(dial, 1.);
  float cap=sdCyl(dp - vec3(0.,.05,0.), .02, .11);
  if (cap < res.x) res=vec2(cap, 2.);
  vec3 h=p - vec3(0., .36 + uA.x, -.06);
  float grip=sdCapsule(h, vec3(-.5,.07,0.), vec3(.5,.07,0.), .08);
  float e1=sdCyl(h - vec3(-.6,-.02,0.), .07, .16);
  float e2=sdCyl(h - vec3(.6,-.02,0.), .07, .16);
  float hs=smin(grip, min(e1,e2), .1);
  if (hs < res.x) res=vec2(hs, 1.);
  return res;
}
// ---------- 4 · sunglasses ----------
float sdLens2(vec2 p){ p.x -= p.y*.18; vec2 b=vec2(.4,.24); float r=.16; vec2 q=abs(p)-b+r; return length(max(q,0.))+min(max(q.x,q.y),0.)-r; }

          draw(shotU(sh, t), t, [0, 0, canvas.width, canvas.height]);
          if (slot === "B") ctxB.drawImage(canvas, 0, 0);
          if (sh.car) {
            setDuo(sh.pal);
            renderCar(CAR, t, t - sh.s);
            if (carHost.parentNode !== hold) hold.appendChild(carHost);
            carHost.style.display = "block";
          }
        }
        const css = (el, tf, op, filter, clip) => {
          el.style.transform = tf;
          el.style.opacity = op.toFixed(3);
          el.style.filter = filter;
          el.style.clipPath = clip;
        };

        function renderAt(t) {
          t = clamp(t, 0, DUR);
          carHost.style.display = "none";
          colHost.style.display = "none";
          let ia = shotIndex(t),
            ib = -1,
            k = 0,
            type = "";
          // transition window straddles the start of a shot
          for (const key in TRANS) {
            const i = +key;
            const [ty, d] = TRANS[key];
            const at = SHOTS[i].s;
            if (t >= at - d / 2 && t < at + d / 2) {
              ia = i - 1;
              ib = i;
              k = (t - (at - d / 2)) / d;
              type = ty;
            }
          }
          if (ib >= 0) renderShot(ib, t, "B");
          renderShot(ia, t, "A");

          const e = k * k * (3 - 2 * k);
          const s = Math.sin(Math.PI * k);
          let fl = 0;
          css(slotA, "none", 1, "none", "none");
          css(slotB, "none", ib >= 0 ? 1 : 0, "none", "none");
          $("mblurG").setAttribute("stdDeviation", "0 0");
          if (ib >= 0) {
            if (type === "zoom") {
              css(slotA, `scale(${(1 + 1.6 * e).toFixed(4)})`, 1, `blur(${(14 * e).toFixed(1)}px)`, "none");
              css(slotB, `scale(${(1.6 - 0.6 * e).toFixed(4)})`, smooth(0.3, 0.7, k), `blur(${(14 * (1 - e)).toFixed(1)}px)`, "none");
              fl = 0.3 * s;
            } else if (type === "whip") {
              $("mblurG").setAttribute("stdDeviation", `${(90 * s).toFixed(1)} 0`);
              css(slotA, `translateX(${(-1080 * e).toFixed(1)}px)`, 1, "url(#mblur)", "none");
              css(slotB, `translateX(${(1080 * (1 - e)).toFixed(1)}px)`, 1, "url(#mblur)", "none");
            } else if (type === "iris") {
              css(slotA, `scale(${(1 + 0.2 * e).toFixed(4)})`, 1, "none", "none");
              css(slotB, `scale(${(1.25 - 0.25 * e).toFixed(4)})`, 1, "none", `circle(${(1250 * e * e).toFixed(1)}px at 50% 50%)`);
              fl = 0.25 * s;
            } else if (type === "spin") {
              css(slotA, `rotate(${(150 * e).toFixed(2)}deg) scale(${(1 + 1.3 * e).toFixed(4)})`, 1 - smooth(0.35, 0.8, k), `blur(${(7 * s).toFixed(1)}px)`, "none");
              css(slotB, `rotate(${(-150 * (1 - e)).toFixed(2)}deg) scale(${(2.3 - 1.3 * e).toFixed(4)})`, smooth(0.2, 0.65, k), `blur(${(7 * s).toFixed(1)}px)`, "none");
            } else if (type === "flash") {
              css(slotB, `scale(${(1.08 - 0.08 * e).toFixed(4)})`, smooth(0.35, 0.65, k), "none", "none");
              fl = 0.42 * s;
            } else if (type === "push") {
              $("mblurG").setAttribute("stdDeviation", `0 ${(80 * s).toFixed(1)}`);
              css(slotA, `translateY(${(-1920 * e).toFixed(1)}px)`, 1, "url(#mblur)", "none");
              css(slotB, `translateY(${(1920 * (1 - e)).toFixed(1)}px)`, 1, "url(#mblur)", "none");
            }
          }
          // camera: gentle kick punches and drift so every shot keeps moving
          const kick = pulse(KICKS, t, 8);
          const hit = pulse(HITS, t, 12);
          const sx = (Math.sin(t * 41.3) + Math.sin(t * 27.1)) * 3.5 * hit + Math.sin(t * 1.3) * 10;
          const sy = (Math.cos(t * 33.7) + Math.sin(t * 19.9)) * 3.5 * hit + Math.cos(t * 1.1) * 8;
          const rz = Math.sin(t * 0.9) * 1.2 + Math.sin(t * 23) * 0.5 * hit;
          $("stage").style.transform = `translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px) rotate(${rz.toFixed(2)}deg) scale(${(1.05 + 0.035 * kick).toFixed(4)})`;
          // drop flash + transition glow, tinted with the incoming palette
          fl = Math.max(fl, 0.75 * Math.exp(-Math.max(0, t - 0.074) * 9) * (t >= 0.074 ? 1 : 0));
          const hc = PAL[SHOTS[ib >= 0 ? ib : ia].pal][2];
          $("flash").style.background = `rgb(${Math.round(hc[0] * 255)},${Math.round(hc[1] * 255)},${Math.round(hc[2] * 255)})`;
          $("flash").style.opacity = clamp(fl, 0, 0.85).toFixed(3);
          $("fade").style.opacity = (1 - smooth(0.0, 0.08, t) + smooth(6.9, 7.0, t)).toFixed(3);
          const r = mulberry32(Math.round(t * FPS) + 1);
          $("grain").style.backgroundPosition = `${Math.floor(r() * 320)}px ${Math.floor(r() * 320)}px`;
        }

        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => renderAt(clock.t) }, 0);
        window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
        renderAt(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
